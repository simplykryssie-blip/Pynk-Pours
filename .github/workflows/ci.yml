name: CI
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Postgres 16 (local, disposable — for migration/RLS tests)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-16
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run build
      - run: npm run check:bundle
