name: CI
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, unit + database tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Postgres 16 (local, disposable — for migration/RLS tests)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-16
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run build
      - run: npm run check:bundle

  e2e:
    name: Integration + end-to-end (local Supabase stack, SAMPLE data, local Stripe test double)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12112:12111"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (Docker; never a hosted project)
        run: npx supabase start
      - name: Write local-only env
        run: |
          npx supabase status -o env \
            | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p; s/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' > .env.local
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3123" >> .env.local
          echo "RATE_LIMIT_SALT=$(openssl rand -hex 32)" >> .env.local
          echo "TICKET_CREDENTIAL_KEY=$(openssl rand -base64 32)" >> .env.local
          # Stripe values below target the LOCAL TEST DOUBLE only (never real Stripe in CI).
          echo "CHECKOUT_ENABLED=true" >> .env.local
          echo "STRIPE_SECRET_KEY=sk_test_LOCAL_DOUBLE_not_a_real_key" >> .env.local
          echo "STRIPE_WEBHOOK_SECRET=whsec_ci_$(openssl rand -hex 16)" >> .env.local
          echo "STRIPE_API_BASE=http://127.0.0.1:12111" >> .env.local
          echo "PYNKPOURS_LOCAL_TEST=true" >> .env.local
      - run: scripts/db/reset-local-demo.sh
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
